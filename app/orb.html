<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'">
<title>Voice Control</title>
<style>
  :root {
    --card: rgba(14, 15, 26, 0.86);
    --card-border: rgba(255, 255, 255, 0.09);
    --text: #f4f4f8;
    --muted: #9a9cb3;
    --faint: #6b6d85;
    --accent: #7c5cff;
    --ease: cubic-bezier(.22, 1, .36, 1);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; background: transparent; overflow: hidden;
    font: 13px/1.4 "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
    color: var(--text); user-select: none;
  }

  #stage { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; }

  /* ---------- orb ---------- */
  #orbWrap { position: relative; width: 150px; height: 150px; flex: none; }
  #orb { width: 100%; height: 100%; display: block; cursor: pointer; }
  #hint {
    position: absolute; left: 50%; bottom: 6px; transform: translateX(-50%);
    font-size: 10.5px; letter-spacing: .04em; color: var(--muted); white-space: nowrap;
    opacity: 0; transition: opacity .4s var(--ease); pointer-events: none;
    text-shadow: 0 1px 6px #000c;
  }
  #orbWrap:hover #hint { opacity: 1; }

  /* ---------- card ---------- */
  #card {
    width: 218px; margin-top: -10px; padding: 12px 13px 11px;
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 22px;
    box-shadow: 0 18px 50px -12px rgba(0,0,0,.65), inset 0 1px 0 rgba(255,255,255,.05);
    display: flex; flex-direction: column; gap: 8px;
    transform-origin: 50% 0;
    transition: opacity .45s var(--ease), transform .55s var(--ease);
    position: relative; overflow: hidden;
  }
  #card::before { /* soft tint that follows the state colour */
    content: ""; position: absolute; inset: -60px -40px auto -40px; height: 180px;
    background: radial-gradient(closest-side, var(--tint, rgba(124,92,255,.22)), transparent);
    transition: background .8s var(--ease); pointer-events: none;
  }
  #card.hidden { opacity: 0; transform: translateY(-10px) scale(.94); pointer-events: none; }

  .head { display: flex; align-items: center; gap: 7px; position: relative; }
  #dot { width: 8px; height: 8px; border-radius: 50%; background: var(--tint-solid, #7c5cff); box-shadow: 0 0 10px var(--tint-solid, #7c5cff); transition: background .6s, box-shadow .6s; flex: none; }
  #label { position: relative; height: 18px; flex: 1; overflow: hidden; font-weight: 600; font-size: 12.5px; letter-spacing: .01em; }
  #label span { position: absolute; left: 0; top: 0; white-space: nowrap; transition: transform .45s var(--ease), opacity .45s var(--ease); }
  #label span.out { transform: translateY(-110%); opacity: 0; }
  #label span.in { transform: translateY(110%); opacity: 0; }
  .dots::after { content: ""; display: inline-block; width: 1.2em; text-align: left; animation: dots 1.2s steps(4) infinite; }
  @keyframes dots { 0% { content: ""; } 25% { content: "."; } 50% { content: ".."; } 75%, 100% { content: "..."; } }

  #eq { display: none; }
  #eq i { display: block; width: 3px; height: 4px; border-radius: 2px; background: var(--tint-solid, #7c5cff); opacity: .9; transition: background .6s; }

  .iconBtn {
    width: 20px; height: 20px; opacity: 0; transition: opacity .25s, background .2s, color .2s; border-radius: 50%; display: grid; place-items: center; cursor: pointer;
    color: var(--faint); flex: none;
  }
  #card:hover .iconBtn { opacity: 1; }
  .iconBtn:hover { background: rgba(255,255,255,.08); color: var(--text); }
  #quit:hover { background: rgba(255, 93, 93, .16); color: #ff7b7b; }

  /* "Conversation on" badge */
  #live { display: none; font-size: 10px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: #7ef9ff; border: 1px solid rgba(126,249,255,.35); border-radius: 999px; padding: 1px 7px; flex: none; }
  #card.convo #live { display: block; animation: livePulse 2.4s ease-in-out infinite; }
  @keyframes livePulse { 50% { opacity: .55; } }
  #detail:empty { display: none; }
  #detail {color: var(--muted); font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; position: relative; transition: opacity .3s; }

  .bubble {position: relative; font-size: 13px; line-height: 1.45; transition: opacity .35s var(--ease), transform .35s var(--ease); }
  .bubble:empty { display: none; }
  /* chat: full messages, newest at the bottom, slim scrollbar */
  #chat {
    display: flex; flex-direction: column; gap: 7px; position: relative;
    max-height: 250px; overflow-y: auto; overscroll-behavior: contain; padding-right: 3px; margin-right: -6px;
    -webkit-mask: linear-gradient(transparent, #000 10px);
    user-select: text;
  }
  #chat:empty { display: none; }
  #chat::-webkit-scrollbar { width: 4px; }
  #chat::-webkit-scrollbar-thumb { background: rgba(255,255,255,.18); border-radius: 4px; }
  #chat::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,.32); }
  .msg { font-size: 12.5px; line-height: 1.45; overflow-wrap: anywhere; animation: rise .35s var(--ease); flex: none; }
  .msg.you { align-self: flex-end; max-width: 88%; background: rgba(255,255,255,.08); color: #dcdde9; padding: 6px 10px; border-radius: 14px 14px 4px 14px; font-size: 12px; }
  .msg.nova { align-self: flex-start; max-width: 96%; color: var(--text); padding: 2px 2px 2px 9px; border-left: 2px solid var(--tint-solid, #7c5cff); transition: border-color .6s; }
  .fresh { animation: rise .45s var(--ease); }
  @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

  #confirm { display: flex; gap: 8px; max-height: 0; opacity: 0; overflow: hidden; transition: max-height .4s var(--ease), opacity .3s; }
  #confirm.show { max-height: 44px; opacity: 1; }
  button { flex: 1; border: 0; border-radius: 11px; padding: 7px; font: inherit; font-weight: 600; cursor: pointer; transition: transform .15s, filter .2s; }
  button:hover { filter: brightness(1.12); }
  button:active { transform: scale(.97); }
  #yes { background: linear-gradient(135deg, #34d399, #10b981); color: #052e1f; }
  #no { background: rgba(255,255,255,.08); color: var(--text); }

  .inputRow { position: relative; display: flex; align-items: center; max-height: 0; opacity: 0; overflow: hidden; transition: max-height .35s var(--ease), opacity .25s; }
  #card:hover .inputRow, #card:focus-within .inputRow { max-height: 40px; opacity: 1; }
  input {
    width: 100%; border: 1px solid rgba(255,255,255,.08); background: rgba(255,255,255,.045); color: var(--text);
    border-radius: 12px; padding: 7px 30px 7px 10px; font-size: 12.5px; font: inherit; outline: none; transition: border-color .25s, background .25s;
  }
  input::placeholder { color: var(--faint); }
  input:focus { border-color: var(--tint-solid, #7c5cff); background: rgba(255,255,255,.07); }
  kbd {
    position: absolute; right: 8px; font: 10px "Segoe UI", sans-serif; color: var(--faint);
    border: 1px solid rgba(255,255,255,.12); border-radius: 5px; padding: 1px 5px; pointer-events: none;
  }
</style>
</head>
<body>
<div id="stage">
  <div id="orbWrap">
    <canvas id="orb"></canvas>
    <div id="hint">Click or press <span id="hk">Ctrl+Alt+V</span></div>
  </div>
  <div id="card" class="hidden hit">
    <div class="head">
      <div id="dot"></div>
      <div id="label"><span>Starting</span></div>
      <div id="live" title="Conversation mode: keep talking, no wake word needed">Live</div>
      <div id="eq"><i></i><i></i><i></i><i></i><i></i></div>
      <div id="quit" class="iconBtn" title="Quit Voice Control">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 3v9"/><path d="M6.3 6.3a8 8 0 1 0 11.4 0"/></svg>
      </div>
      <div id="close" class="iconBtn" title="Hide card">
        <svg width="10" height="10" viewBox="0 0 10 10"><path d="M1 1l8 8M9 1L1 9" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      </div>
    </div>
    <div id="detail"></div>
    <div id="chat"></div>
    <div id="confirm"><button id="yes">Yes</button><button id="no">No</button></div>
    <div class="inputRow">
      <input id="typed" placeholder="Type instead…" spellcheck="false">
      <kbd>↵</kbd>
    </div>
  </div>
</div>
<script src="orb-renderer.js"></script>
<script src="orb.js"></script>
</body>
</html>
