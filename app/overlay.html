<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'">
<title>Voice Control Overlay</title>
<style>
  /* Animatable custom properties: colours and angle tween smoothly between states. */
  @property --a  { syntax: '<angle>'; inherits: true; initial-value: 0deg; }
  @property --c1 { syntax: '<color>'; inherits: true; initial-value: #4f5bd5; }
  @property --c2 { syntax: '<color>'; inherits: true; initial-value: #7c5cff; }
  @property --c3 { syntax: '<color>'; inherits: true; initial-value: #1fb6d6; }
  @property --c4 { syntax: '<color>'; inherits: true; initial-value: #2a3a8f; }

  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; font: 13px "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif; color: #f4f4f8; }
  :root {
    --lv: 0;      /* voice / speech level 0..1 */
    --spin: 6s;   /* rotation speed of the gradient */
    transition: --c1 .9s, --c2 .9s, --c3 .9s, --c4 .9s;
  }
  .grad { background: conic-gradient(from var(--a), var(--c1), var(--c2), var(--c3), var(--c4), var(--c2), var(--c1)); animation: spin var(--spin) linear infinite; }
  @keyframes spin { to { --a: 360deg; } }

  /* ---------- screen-edge glow ---------- */
  #edge { position: fixed; inset: 0; pointer-events: none; opacity: 0; transition: opacity .7s cubic-bezier(.22,1,.36,1); }
  body.on #edge { opacity: 1; }
  .ring { position: absolute; inset: 0; }
  /* Thin crisp line right at the screen edge. */
  .ring.line {
    padding: 2.5px; opacity: .95;
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor; mask-composite: exclude;
  }
  /* Light that fades inward from every edge; grows with your voice. */
  .ring.soft, .ring.wide {
    -webkit-mask:
      linear-gradient(to right,  #000, transparent var(--g)),
      linear-gradient(to left,   #000, transparent var(--g)),
      linear-gradient(to bottom, #000, transparent var(--g)),
      linear-gradient(to top,    #000, transparent var(--g));
  }
  .ring.soft { --g: calc(26px + var(--lv) * 34px); opacity: calc(.62 + var(--lv) * .3); }
  .ring.wide { --g: calc(90px + var(--lv) * 90px); opacity: calc(.16 + var(--lv) * .22); }

  /* ---------- top status pill ---------- */
  #hud {
    position: fixed; top: 14px; left: 50%; transform: translate(-50%, -140%);
    display: flex; align-items: center; gap: 10px; padding: 8px 16px 8px 9px; min-width: 210px; max-width: 70vw;
    background: rgba(12, 13, 24, .82); border-radius: 999px;
    box-shadow: 0 10px 40px -8px rgba(0,0,0,.6), 0 0 0 1px rgba(255,255,255,.08) inset, 0 0 28px -6px var(--c1);
    transition: transform .65s cubic-bezier(.22,1.2,.36,1), box-shadow .9s;
  }
  body.on #hud { transform: translate(-50%, 0); }
  #dot { width: 22px; height: 22px; border-radius: 50%; flex: none; position: relative; box-shadow: 0 0 14px var(--c1); }
  #dot::after { content: ""; position: absolute; inset: 0; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fff9, transparent 55%); }
  #brand { font-weight: 700; font-size: 12px; letter-spacing: .02em; white-space: nowrap; background: linear-gradient(90deg, #fff, color-mix(in srgb, var(--c3) 70%, #fff)); -webkit-background-clip: text; background-clip: text; color: transparent; }
  #sep { width: 1px; height: 14px; background: rgba(255,255,255,.18); flex: none; }
  #action { position: relative; height: 18px; flex: 1; overflow: hidden; min-width: 120px; }
  #action span { position: absolute; left: 0; top: 0; white-space: nowrap; color: #d9dbeb; transition: transform .45s cubic-bezier(.22,1,.36,1), opacity .45s; }
  #action span.out { transform: translateY(-120%); opacity: 0; }
  #action span.in { transform: translateY(120%); opacity: 0; }
  .shimmer { background: linear-gradient(90deg, #c9cbe0 0%, #fff 45%, #c9cbe0 60%); background-size: 220% 100%; -webkit-background-clip: text; background-clip: text; color: transparent !important; animation: shimmer 1.6s linear infinite; }
  @keyframes shimmer { from { background-position: 120% 0; } to { background-position: -120% 0; } }
  #bars { display: flex; align-items: center; gap: 2.5px; height: 16px; }
  #bars i { width: 3px; height: 3px; border-radius: 2px; background: var(--c3); transition: height .08s; }

  /* ---------- click ripples ---------- */
  .ripple { position: fixed; pointer-events: none; transform: translate(-50%, -50%); }
  .ripple i { position: absolute; left: 50%; top: 50%; width: 18px; height: 18px; margin: -9px; border-radius: 50%; border: 2.5px solid var(--c3); box-shadow: 0 0 16px var(--c3); animation: ring 1s cubic-bezier(.22,1,.36,1) forwards; }
  .ripple i:nth-child(2) { animation-delay: .14s; border-color: var(--c1); }
  .ripple b { position: absolute; left: 50%; top: 50%; width: 10px; height: 10px; margin: -5px; border-radius: 50%; background: #fff; box-shadow: 0 0 12px var(--c3), 0 0 26px var(--c1); animation: dot 1.1s ease-out forwards; }
  .ripple em {
    position: absolute; left: 16px; top: 14px; white-space: nowrap; font-style: normal; font-size: 11.5px; font-weight: 600;
    padding: 4px 9px; border-radius: 999px; background: rgba(12,13,24,.85); box-shadow: 0 0 0 1px rgba(255,255,255,.1) inset, 0 0 18px -4px var(--c1);
    animation: tag 1.6s ease forwards;
  }
  @keyframes ring { from { transform: scale(.4); opacity: 1; } to { transform: scale(4.2); opacity: 0; } }
  @keyframes dot { 0% { transform: scale(0); } 15% { transform: scale(1.3); } 100% { transform: scale(.6); opacity: 0; } }
  @keyframes tag { 0% { opacity: 0; transform: translateY(4px); } 12% { opacity: 1; transform: none; } 75% { opacity: 1; } 100% { opacity: 0; } }
</style>
</head>
<body>
  <div id="edge">
    <div class="ring wide grad"></div>
    <div class="ring soft grad"></div>
    <div class="ring line grad"></div>
  </div>
  <div id="hud">
    <div id="dot" class="grad"></div>
    <div id="brand">AI Assistant</div>
    <div id="sep"></div>
    <div id="action"><span></span></div>
    <div id="bars"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
  </div>
  <div id="ripples"></div>
<script src="overlay.js"></script>
</body>
</html>
