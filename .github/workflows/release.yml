# Builds the Windows installer (Nova Setup x.y.z.exe) and a zip on GitHub's Windows machines.
# Run it from the Actions tab ("Run workflow"), or push a tag like v0.2.0 to also attach
# the files to a GitHub release.
name: Build Windows installer

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx tsc -p . && npx electron-builder --win nsis zip --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: Nova-windows
          path: |
            release/*.exe
            release/*.zip
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.exe
            release/*.zip
